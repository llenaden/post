<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Конструктор каруселей</title>
<meta name="description" content="Конструктор карточек для каруселей в Instagram и Telegram: обложка, полезные карточки и карточка о себе — готовые PNG 1080×1080.">
<meta name="theme-color" content="#EFEFF1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Карусель">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Lobster&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: native-style single-task screens — top bar (back · title/step · close), one centered question, content, round "next" button with a progress ring.
   Type: 20 headings / 14 body & labels / 12 inputs, hints, captions. Spacing: 8 / 16 / 24 / 40. */
:root{
  --page:#EFEFF1; --white:#FFFFFF; --soft:#F5F5F7; --ink:#111214; --muted:#8B8B93; --line:#E3E3E8;
  --blue:#4A7BDB; --navy:#2E3239; --sky:#DCE6FA; --blue-soft:#EAF0FB; --green:#22B45E; --danger:#E0402F;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Onest","Helvetica Neue",Arial,sans-serif;
  --logo:"Lobster","Onest",cursive;
  --fs-h:21px; --fs-b:15px; --fs-s:13px;
  --s1:8px; --s2:16px; --s3:24px; --s4:40px;
  --shadow:0 1px 2px rgba(17,18,20,.04),0 8px 24px -12px rgba(17,18,20,.18);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--page)}
body{color:var(--ink);font-family:var(--ui);font-size:var(--fs-b);line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{max-width:480px;margin:0 auto;min-height:100%}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:center;gap:var(--s2);padding-block:8px;margin-inline:-16px;padding-inline:16px;background:rgba(239,239,241,.86);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);transition:box-shadow .2s}
.topbar.scrolled{box-shadow:0 .5px 0 var(--line)}
.progress{height:4px;border-radius:2px;background:#DCDCE1;overflow:hidden}
.progress i{display:block;height:100%;border-radius:2px;background:var(--ink);transition:width .3s}
.tb-label{text-align:center;font-size:var(--fs-s);color:var(--muted);font-weight:500}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--page)}
.cbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--white);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);padding:0;color:var(--ink);position:relative}
.cbtn::after{content:"";position:absolute;inset:-4px}
.cbtn.gray{background:#E4E4E8;box-shadow:none}
.cbtn svg{width:17px;height:17px}
.cbtn.blank{visibility:hidden}
.tb-title{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.tb-title b{font-size:var(--fs-b);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tb-title small{font-size:var(--fs-s);color:var(--muted)}

/* screen */
.screen{display:flex;flex-direction:column;gap:20px;padding-block:var(--s2) 112px}
.screen.anim{animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.q{display:flex;flex-direction:column;gap:4px;text-align:center;align-items:center;padding-inline:var(--s2)}
.q h1{font-size:calc(var(--fs-h) - 4px);font-weight:600;letter-spacing:-.01em;line-height:1.25;text-wrap:balance;max-width:20ch}
.q p{color:var(--muted);font-size:var(--fs-b);max-width:32ch;text-wrap:balance}

/* home */
/* home rhythm: 1x = 16px between cards, 2x = 32px from the top navigation to the first card; the logo sits on the navigation line */
/* home: logo in the flow, cards 2x = 32px below it (the phone app covers the strip with its ✕ / ⋯ buttons, so the logo stays below it) */
.home{display:flex;flex-direction:column;gap:16px;padding-top:8px;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.home .brand{position:relative;align-self:center;transform:rotate(-4deg);font-size:29px;line-height:37px;height:37px;margin:0 0 16px;z-index:12}
.home-title{font-size:var(--fs-s);color:var(--muted);font-weight:500;padding-inline:4px;margin-top:8px}
.brand{font-family:var(--logo);color:var(--blue);font-size:35px;line-height:1;transform:rotate(-4deg);display:inline-block;align-self:center}
.me{display:flex;align-items:center;gap:12px;background:var(--white);border-radius:24px;padding:16px 20px;box-shadow:var(--shadow);border:0;text-align:left;width:100%}
.me .av{width:48px;height:48px;border-radius:50%;flex:none;background:var(--sky) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--navy);font-size:21px}
.me .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.me b{font-size:var(--fs-b);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{font-size:var(--fs-s);color:var(--muted)}
.me .chev{color:var(--muted)}
.me .chev svg{width:18px;height:18px;display:block}
.hero-card{background:var(--white);border-radius:24px;padding:24px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.fan{position:relative;height:140px;width:100%}
.fan img{position:absolute;top:10px;left:50%;width:120px;height:120px;border-radius:16px;box-shadow:var(--shadow);object-fit:cover;background:var(--white)}
.hero-card h2{font-size:calc(var(--fs-h) - 4px);font-weight:600;letter-spacing:-.01em}
.hero-card p{color:var(--muted);max-width:30ch;font-size:var(--fs-s);line-height:1.4}
.hero-card{border:0;width:100%;font:inherit;color:inherit;cursor:pointer}
.resume{display:flex;align-items:center;gap:16px;background:var(--white);border-radius:24px;padding:16px 20px 16px 16px;box-shadow:var(--shadow);border:0;text-align:left;width:100%;cursor:pointer}
.resume canvas{width:88px;height:88px;border-radius:14px;flex:none;box-shadow:0 0 0 1px var(--line);background:var(--soft)}
.resume .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.resume small{font-size:var(--fs-s);color:var(--muted)}
.resume b{font-size:var(--fs-b);font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.resume .tag{font-size:var(--fs-s);color:var(--blue);font-weight:600}
.resume .chev,.me .chev{color:var(--muted)}
.resume .chev svg{width:18px;height:18px;display:block}
.newcard{gap:8px}
.newcard .plus{width:48px;height:48px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:4px}
.newcard .plus svg,.me .av svg{width:20px;height:20px;display:block}

/* buttons */
.btn{border:0;background:var(--white);border-radius:999px;min-height:48px;padding:0 var(--s3);font-weight:600;font-size:var(--fs-b);display:inline-flex;align-items:center;justify-content:center;gap:var(--s1);white-space:nowrap;box-shadow:var(--shadow);color:var(--ink);text-decoration:none}
.btn svg{width:18px;height:18px;flex:none}
.btn.dark{background:var(--ink);color:#fff;box-shadow:none}
.btn.wide{width:100%}
.btn.text{background:none;box-shadow:none;color:var(--muted);min-height:44px}
.btn.soft{background:var(--soft);box-shadow:none;min-height:44px}
.btn[disabled]{opacity:.5;cursor:default}

/* bottom bar with round next */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.bottombar>*{pointer-events:auto}
.next{height:60px;min-width:60px;border-radius:999px;border:0;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0;font-weight:600;font-size:var(--fs-b);box-shadow:0 10px 24px -8px rgba(17,18,20,.55);transition:background .15s}
.next svg{width:22px;height:22px;flex:none}
.next.pill{padding:0 24px 0 28px}
.next.ghost{background:var(--white);color:var(--ink);box-shadow:var(--shadow)}
.next.off{background:#C4C4CA;color:#fff;box-shadow:none}
.bottombar .btn.dark{min-height:56px;width:100%;max-width:448px;box-shadow:0 10px 24px -8px rgba(17,18,20,.55)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;border:0;background:var(--white);border-radius:24px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);text-align:center;transition:box-shadow .15s,transform .15s}
.tile .tpl-art{width:100%;aspect-ratio:1/1;border-radius:16px;display:block;object-fit:cover;background:var(--soft)}
.tile span.nm{font-size:var(--fs-s);font-weight:500}
.tile[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--blue),var(--shadow)}
.tile[aria-pressed="true"] span.nm{color:var(--blue);font-weight:600}
.tile .tick{position:absolute;top:-6px;right:-6px;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:none;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--white)}
.tile .tick svg{width:16px;height:16px}
.tile[aria-pressed="true"] .tick{display:flex}
.none-art{display:flex!important;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:var(--muted);font-size:var(--fs-s);border:1.5px dashed #CDCDD3}
.none-art b{font-size:29px;font-weight:300;line-height:1}
.tiles.cols-1{grid-template-columns:1fr}

/* edit screen */
.preview{align-self:center;width:min(260px,70%);display:flex;flex-direction:column;gap:var(--s1);align-items:center}
.preview canvas{width:100%;aspect-ratio:1/1;border-radius:16px;display:block;box-shadow:var(--shadow);background:var(--white)}
.card-acts{display:flex;align-items:center;gap:var(--s1);margin-top:var(--s1)}
.ex-btn{width:36px;height:36px;border:0;border-radius:999px;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ex-btn:active{opacity:.8}
.clear-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:rgba(224,64,47,.1);color:var(--danger);font:inherit;font-size:var(--fs-s);font-weight:600;min-height:36px;padding:0 14px;border-radius:999px;cursor:pointer}
.clear-btn:active{background:rgba(224,64,47,.18)}
.preview:has(.card-acts){margin-bottom:-4px}
.preview .warn{color:var(--danger);font-size:var(--fs-s);font-weight:600;text-align:center}
.panel{background:var(--white);border-radius:24px;padding:24px 20px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.label{font-size:var(--fs-b);font-weight:600;line-height:1.3}
.hint{font-size:var(--fs-s);color:var(--muted);line-height:1.4}
input[type=text],textarea{width:100%;min-height:48px;background:var(--soft);border:1px solid transparent;border-radius:12px;padding:14px 16px;font-size:var(--fs-s);line-height:1.5;resize:none;overflow:hidden}
.inp{display:block;min-width:0;position:relative}
.inp>input[type=text],.inp>textarea{font-size:13px;line-height:20px}
/* iOS zooms the screen into any field whose font-size is under 16px. Keep font-size 16px there but draw the glyphs at 12px:
   font-size-adjust scales the letters by x-height (SF Pro x-height ≈ .526 → 13px look = .427), with no transforms, so the caret and selection stay normal. */
@supports (-webkit-touch-callout:none) and (font-size-adjust:1){
  .inp>input[type=text],.inp>textarea,.inp>input[type=text]::placeholder,.inp>textarea::placeholder{font-size:16px;font-size-adjust:.427;line-height:20px}
}
input[type=text],textarea{caret-color:var(--blue);-webkit-user-select:text;user-select:text}
input[type=text]::selection,textarea::selection{background:rgba(67,115,214,.28);color:inherit}
input[type=text]::placeholder,textarea::placeholder{color:#B9B9C0;font-size:13px;line-height:1.5}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--blue);background:var(--white)}
.big-input input,.big-input textarea{background:var(--white);box-shadow:var(--shadow);text-align:center}
.big-input textarea{text-align:left}
input[type=range]{width:100%;accent-color:var(--blue);margin:0}
.slider{display:grid;grid-template-columns:96px minmax(0,1fr);gap:var(--s2);align-items:center;font-size:var(--fs-s);color:var(--muted)}
.file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.srcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:12px 8px}
.src{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;font-size:var(--fs-s);color:var(--muted);text-align:center;line-height:1.2;white-space:nowrap;cursor:pointer;text-decoration:none}
.src .th{width:54px;height:54px;border-radius:16px;background:var(--soft) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.src .th svg{width:20px;height:20px}
.src.on{color:var(--blue);font-weight:600}
.src.on .th{box-shadow:0 0 0 3px var(--blue)}
.swatches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px}
.swb{display:flex;flex-direction:column;align-items:center;gap:var(--s1);border:0;background:none;padding:0;font-size:var(--fs-s);color:var(--muted)}
.swb i{width:36px;height:36px;border-radius:50%;display:block;box-shadow:0 0 0 1px var(--line);border:3px solid var(--white)}
.swb.on i{box-shadow:0 0 0 2px var(--blue)}
.swb.on{color:var(--ink);font-weight:600}
.icons{display:flex;gap:var(--s1);overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.icons::-webkit-scrollbar{display:none}
.icons button{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--soft);display:flex;align-items:center;justify-content:center;padding:0}
.icons button svg{width:17px;height:17px}
.icons button.on{background:var(--blue);color:#fff}
.icons .num{font-weight:700;font-size:var(--fs-b)}
.stat-row{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;gap:var(--s1);align-items:center}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none;padding:0}
.x svg{width:15px;height:15px}
.note{display:flex;justify-content:space-between;gap:var(--s2);align-items:center;background:var(--soft);border-radius:12px;padding:12px 14px;font-size:var(--fs-s);color:var(--muted)}
.link{background:none;border:0;padding:12px;margin:-12px;color:var(--blue);font-size:var(--fs-s);font-weight:600;flex:none}

/* profile photo screens */
.photo-big{align-self:center;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.photo-acts{display:flex;flex-direction:column;align-items:center;gap:0}
.photo-big canvas{display:block;box-shadow:var(--shadow);background:var(--white);touch-action:none}
.photo-big .round{width:200px;height:200px;border-radius:50%}
.photo-big .tall{width:200px;height:280px;border-radius:16px;cursor:grab}
.crop{align-self:center;width:min(300px,100%)}
.crop-cv{width:100%;aspect-ratio:1/1;display:block;border-radius:20px;touch-action:none;cursor:grab;background:#000}
.check{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--white);border-radius:24px;padding:14px 20px;box-shadow:var(--shadow)}
.check input{width:22px;height:22px;accent-color:var(--blue);flex:none}

/* iOS switch & slider */
.sw{position:relative;flex:none;width:51px;height:31px}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:999px;background:#E2E2E7;transition:background .2s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s}
.sw input:checked+i{background:var(--green)}
.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--blue);outline-offset:2px}
input[type=range]{-webkit-appearance:none;appearance:none;height:44px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#DADAE0}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#DADAE0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);margin-top:-12px;border:0}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);border:0}
/* count */
.counter{display:flex;align-items:center;justify-content:center;gap:var(--s3);padding-block:var(--s2)}
.counter button{width:64px;height:64px;border-radius:50%;border:0;background:var(--white);font-size:29px;font-weight:300;box-shadow:var(--shadow);line-height:1}
.counter button[disabled]{opacity:.35;cursor:default}
.counter output{font-size:57px;font-weight:600;min-width:96px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding-inline:var(--s3)}
.dots i{width:28px;height:28px;border-radius:8px;background:var(--white);box-shadow:var(--shadow)}
.dots i.cv{background:var(--ink)}
.dots i.fn{background:var(--sky)}

/* result */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card-out{position:relative;margin:0;display:flex;flex-direction:column;gap:6px}
.dl::after{content:"";position:absolute;inset:-4px}
.card-out img{width:100%;aspect-ratio:1/1;display:block;border-radius:16px;box-shadow:var(--shadow);background:var(--white);cursor:pointer}
.card-out figcaption{font-size:var(--fs-s);color:var(--muted);display:flex;align-items:center;justify-content:space-between;padding-left:4px}
.dl{width:36px;height:36px;position:relative;border-radius:50%;border:0;background:var(--white);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);color:var(--ink);padding:0}
.dl svg{width:18px;height:18px}
.dl.ok{background:var(--green);color:#fff}

.modal{position:fixed;inset:0;z-index:40;background:rgba(17,18,20,.5);display:flex;align-items:flex-end;justify-content:center;padding-top:max(40px,env(safe-area-inset-top,0px))}
/* sheets reuse the screen rhythm: 16px page gutter, 24px top like panels, heading→hint 4px like .q, 16px between groups, 56px main button like the bottom bar */
.sheet{background:var(--page);border-radius:24px 24px 0 0;padding:var(--s3) max(var(--s2),env(safe-area-inset-right,0px)) calc(var(--s2) + env(safe-area-inset-bottom,0px)) max(var(--s2),env(safe-area-inset-left,0px));max-width:480px;width:100%;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:var(--s2)}
.sheet h3+p{margin-top:-12px}
.sheet h3,.sheet>p{padding-inline:var(--s2)}
.sheet .acts .btn.dark{min-height:56px}
.btn.danger{background:rgba(224,64,47,.1);color:var(--danger);box-shadow:none;min-height:48px;width:100%}
.btn.danger:active{background:rgba(224,64,47,.18)}
.sheet h3{font-size:calc(var(--fs-h) - 4px);font-weight:600;line-height:1.25;text-align:center}
.sheet p{color:var(--muted);text-align:center;font-size:var(--fs-s);line-height:1.45}
.sheet .grid img{width:100%;border-radius:14px;display:block}
.sheet .acts{display:flex;flex-direction:column;gap:var(--s1)}
.nets{display:flex;flex-wrap:wrap;gap:8px}
.net{border:0;background:var(--white);box-shadow:var(--shadow);border-radius:999px;min-height:40px;padding:0 16px 0 10px;font-size:var(--fs-s);font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.net img{width:20px;height:20px;display:block}
.net.on{box-shadow:0 0 0 2px var(--blue)}

.net-up{display:flex;align-items:center;gap:16px}
.net-ic{width:32px;height:32px;border-radius:8px;background:transparent center/contain no-repeat;flex:none}
.net-ic:not([style]){display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:var(--fs-b);font-weight:500;max-width:calc(100vw - 32px);text-align:center}

@media (prefers-reduced-motion:reduce){ .screen.anim{animation:none} .next .ring .fg{transition:none} }
</style>
</head>

(()=>{
const S=1080, P=72;
const FONT='Onest, "Helvetica Neue", Arial, sans-serif';
const fnt=(w,s)=>`${w} ${Math.round(s*10)/10}px ${FONT}`;
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);

/* ================= brand ================= */
/* brand palette only: blue, lime, white/light grey; graphite is a secondary dark. No lavender, no deep navy. */
const BR={blue:'#4373D6',blueDeep:'#2F5BC4',blueLight:'#6E97E8',lime:'#CEDB57',graphite:'#2E3239',light:'#EEF2F7',ink:'#121620',white:'#FFFFFF',sky:'#DCE6FA'};
BR.navy=BR.blue;
const BGS=[['white','Белый'],['light','Светлый'],['blue','Синий'],['lime','Салатовый'],['grad','Градиент'],['graphite','Графит']];
const BG_CSS={white:'#fff',light:BR.light,blue:BR.blue,lime:BR.lime,grad:`linear-gradient(135deg,${BR.blueDeep},${BR.blueLight})`,graphite:BR.graphite};
const LEGACY_BG={sky:'light',lavender:'light',navy:'blue',black:'graphite'};
function palette(bg){
  bg=LEGACY_BG[bg]||bg;
  const bodyDark='#3A4255', bodyLight='#FFFFFF', deep=BR.blueDeep;
  const lightBase={fg:BR.ink,sub:bodyDark,acc:BR.blue,accFg:'#fff',mark:BR.blue,line:'rgba(18,22,32,.12)'};
  const darkBase={fg:'#fff',sub:bodyLight,acc:BR.lime,accFg:BR.ink,mark:BR.lime};
  switch(bg){
    case 'light': return {...lightBase,bg:BR.light,decor:'#FFFFFF',ring:'#FFFFFF'};
    case 'blue': return {...darkBase,bg:BR.blue,cta:'#FFFFFF',line:'rgba(255,255,255,.28)',decor:'rgba(255,255,255,.12)',ring:'rgba(255,255,255,.28)'};
    case 'lime': return {...lightBase,bg:BR.lime,acc:BR.blue,mark:deep,line:'rgba(18,22,32,.16)',decor:'rgba(255,255,255,.35)',ring:'#FFFFFF'};
    case 'grad': return {...darkBase,bg:'grad',cta:'#FFFFFF',line:'rgba(255,255,255,.28)',decor:'rgba(255,255,255,.1)',ring:'rgba(255,255,255,.25)'};
    case 'graphite': return {...darkBase,bg:BR.graphite,line:'rgba(255,255,255,.18)',decor:'rgba(255,255,255,.06)',ring:'rgba(255,255,255,.14)'};
    case 'photo': return {...darkBase,acc:'#fff',line:'rgba(255,255,255,.35)',ring:'rgba(255,255,255,.3)'};
    default: return {...lightBase,bg:'#FFFFFF',decor:BR.light,ring:BR.sky};
  }
}

const P2D={}; for(const k in ICONS) if(ICONS[k].d) P2D[k]=new Path2D(ICONS[k].d);

function fileToDataURL(file,max){

const GLUE_PREV=new Set(['же','ж','ли','ль','бы','б']);
function typo(t){
  return String(t||'')

    .replace(/\.\.\./g,'…')
    .replace(/(\S)[ \t]+[-–—][ \t]+/g,'$1 — ')

function tokenize(text){

    if(toPrev) res[res.length-1].push(w); else res.push([w]);

function renderInner(ctx,c){

    const bg=bgKey(c), cx=S-P-QD/2, cy=top+QD/2;
    ctx.beginPath(); ctx.arc(cx,cy,QD/2,0,Math.PI*2); ctx.fillStyle=bg==='lime'?BR.blue:BR.lime; ctx.fill();

    const ex=imgInfo(c.img,c), show=ex||R.demo, ring=12;
    const st=stack(ctx,innerBlocks(c,show?S-P-EXD-ring-40-P:0),pal,W,bottom-top);

function renderCard(ctx,c,idx,total,demo){

      const zoomTo=(nz,cx=V/2,cy=V/2)=>{ nz=Math.max(1,Math.min(4,nz)); const k=nz/z; ox=cx-(cx-ox)*k; oy=cy-(cy-oy)*k; z=nz; draw(); slider.value=Math.round(z*100); };

  [['c-photo','cover',-58,-8],['a-badge','final',58,8],['i-list','inner',0,0]].forEach(([t,k,dx,rot])=>{ const im=h('img',{cls:'tpl-art',alt:'','data-tpl':t,'data-kind':k,src:tileSrc(t,k)}); im.style.transform=`translateX(calc(-50% + ${dx}px)) rotate(${rot}deg)`; fan.append(im); });
  main.append(
    h('button',{type:'button',cls:'hero-card newcard',onclick:()=>inProgress?confirmNew():startCarousel(true)},fan,h('h2',null,'Создать карусель'),h('p',null,'Обложка, полезные карточки и карточка о вас'),h('span',{cls:'plus',html:SV.plus})));
  app.append(main); if(homeThumb) homeThumb();
}

/* ================= build & result ================= */
let outputs=[];
function cardBlob(card,i,n){
  return new Promise(res=>{ const cv=document.createElement('canvas'); cv.width=S; cv.height=S; const over=renderCard(cv.getContext('2d'),card,i,n,false);
    cv.toBlob(b=>res({blob:b,over,url:URL.createObjectURL(b),name:`karusel-${String(i+1).padStart(2,'0')}.png`}),'image/png'); });
}
async function build(){
  const list=steps(); const bad=list.findIndex(st=>problemOf(st));
  if(bad>=0){ ui.i=bad; render(true); toast(problemOf(list[bad])); return; }
  const b=$('#nextBtn'); if(b) b.disabled=true; toast('Собираю карусель…');
  try{ if(document.fonts) await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2500))]); }catch(e){}
  outputs.forEach(o=>URL.revokeObjectURL(o.url));
  const cards=allCards(); outputs=[];
  for(let i=0;i<cards.length;i++){ const o=await cardBlob(cards[i],i,cards.length); o.label=TPLNAME[cards[i].tpl]||''; o.stepIndex=list.findIndex(st=>(cards[i]===draft.cover&&st.id==='cover-edit')||(cards[i]===draft.final&&st.id==='final-edit')||(st.id==='inner-edit'&&draft.inner[st.i]===cards[i])); outputs.push(o); }
  $('#toast').hidden=true; show('result');
}
function markSaved(o){ if(o.btn){ o.btn.classList.add('ok'); o.btn.innerHTML=SV.tick; o.btn.setAttribute('aria-label','Сохранено'); } }
function renderResult(app){
  const n=outputs.length;
  app.append(topbar({label:`${n} ${plural(n,'картинка','картинки','картинок')}`}));
  const grid=h('div',{cls:'grid'});
  outputs.forEach((o,i)=>{
    const dl=h('button',{type:'button',cls:'dl',html:SV.dl,'aria-label':`Скачать карточку ${i+1}`});
    dl.onclick=async()=>{ dl.disabled=true; const r=await saveOne(o); dl.disabled=false; if(r==='saved') markSaved(o); };
    o.btn=dl;
    const img=h('img',{src:o.url,alt:`Карточка ${i+1}`,title:'Нажмите, чтобы изменить'}); img.onclick=()=>{ if(o.stepIndex>=0){ ui.mode='carousel'; ui.i=o.stepIndex; ui.view='flow'; ui.fromResult=true; render(true); } };
    grid.append(h('figure',{cls:'card-out'},img,h('figcaption',null,h('span',{style:o.over?'color:var(--danger);font-weight:600':null},o.over?`${i+1} · текст не помещается`:String(i+1)),dl)));
  });
  app.append(h('main',{cls:'screen anim'},question('Карусель готова','Нажмите на карточку, чтобы изменить'),grid));
  const bar=h('div',{cls:'bottombar'},h('button',{type:'button',cls:'btn dark',id:'saveAll',html:SV.dl+(n===1?'Сохранить картинку':'Сохранить все')}));
  const touch=matchMedia('(pointer:coarse)').matches;
  if(n>1&&!touch) bar.append(h('button',{type:'button',cls:'btn text',id:'saveZip'},'Одним архивом .zip'));
  app.append(bar);
  $('#saveAll').onclick=saveAll; if($('#saveZip')) $('#saveZip').onclick=saveZip;
}
async function downloadsApi(){ try{ if(window.claude&&typeof window.claude.use==='function') return await window.claude.use('downloads'); }catch(e){} return null; }
/* outside Claude (e.g. GitHub Pages): share sheet on phones («Сохранить изображения»), a normal download on computers */
async function nativeSave(list){
  try{ const files=list.map(o=>new File([o.blob],o.name,{type:o.blob.type||'image/png'}));
    if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files})){ try{ await navigator.share({files}); return 'saved'; }catch(e){ if(e&&e.name==='AbortError') return 'declined'; } }
    for(const o of list){ const a=document.createElement('a'), u=URL.createObjectURL(o.blob); a.href=u; a.download=o.name; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); await new Promise(r=>setTimeout(r,250)); }
    return 'saved'; }catch(e){ return 'fallback'; }
}
async function saveOne(o,quiet){
  const dl=await downloadsApi();
  if(!dl){ const r=await nativeSave([o]); if(r==='fallback') showFallback([o]); else if(r==='saved'&&!quiet) toast('Сохранено'); return r; }
  try{ await dl.save({filename:o.name,data:o.blob}); if(!quiet) toast('Сохранено'); return 'saved'; }
  catch(e){ const c=e&&e.code;
    if(c==='declined'){ if(!quiet) toast('Сохранение отменено'); return 'declined'; }
    if(c==='rate_limited'){ await new Promise(r=>setTimeout(r,1200)); try{ await dl.save({filename:o.name,data:o.blob}); return 'saved'; }catch(_){ toast('Подождите секунду и нажмите ещё раз'); return 'error'; } }
    showFallback([o]); return 'fallback'; }
}
async function saveAll(){
  const btn=$('#saveAll'); btn.disabled=true; let n=0;
  if(!(await downloadsApi())){ const r=await nativeSave(outputs); if(r==='saved'){ outputs.forEach(markSaved); toast(outputs.length===1?'Картинка сохранена':`Сохранено: ${outputs.length} ${plural(outputs.length,'картинка','картинки','картинок')}`); } else if(r==='fallback') showFallback(outputs); btn.disabled=false; return; }
  for(const o of outputs){
    const r=await saveOne(o,true);
    if(r==='saved'){ n++; markSaved(o); continue; }
    if(r==='declined') toast(n?`Сохранено ${n} из ${outputs.length}`:'Сохранение отменено');
    if(r==='fallback') showFallback(outputs);
    break;
  }
  if(n===outputs.length) toast(n===1?'Картинка сохранена':`Сохранено: ${n} ${plural(n,'картинка','картинки','картинок')}`);
  btn.disabled=false;
}
async function saveZip(){
  const dl=await downloadsApi();
  if(!window.JSZip){ showFallback(outputs); return; }
  const btn=$('#saveZip'); btn.disabled=true;
  try{ const zip=new JSZip(); outputs.forEach(o=>zip.file(o.name,o.blob)); const z=await zip.generateAsync({type:'blob'});
    if(!dl){ const r=await nativeSave([{name:'karusel.zip',blob:z}]); if(r==='saved') toast('Архив сохранён'); else if(r==='fallback') showFallback(outputs); btn.disabled=false; return; }
    await dl.save({filename:'karusel.zip',data:z}); toast('Архив сохранён'); }
  catch(e){ const c=e&&e.code; if(c==='declined') toast('Сохранение отменено'); else if(c==='rate_limited') toast('Подождите секунду и нажмите ещё раз'); else showFallback(outputs); }
  btn.disabled=false;
}
function showFallback(list){
  const m=$('#modal'); m.innerHTML='';
  const grid=h('div',{cls:'grid',style:list.length===1?'grid-template-columns:1fr':null}); list.forEach(o=>grid.append(h('img',{src:o.url,alt:o.name})));
  m.append(h('div',{cls:'sheet',role:'dialog','aria-label':'Сохраните картинки'},h('h3',null,'Сохраните картинки'),
    h('p',null,'Нажмите на картинку и удерживайте, затем «Сохранить в Фото». На компьютере — правый клик → «Сохранить изображение».'),grid,
    h('button',{type:'button',cls:'btn dark wide',onclick:()=>m.hidden=true},'Готово')));
  m.hidden=false;
}
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') e.target.hidden=true; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('#modal').hidden=true; });

/* ================= boot ================= */
addEventListener('scroll',()=>{ const t=document.querySelector('.topbar'); if(t) t.classList.toggle('scrolled',scrollY>4); },{passive:true});
onImgLoad=()=>{ refreshPreviews(); refreshTiles(); if(photoRedraw) photoRedraw(); if(homeThumb) homeThumb(); refreshNext(); };
if(document.fonts) document.fonts.ready.then(()=>{ if(homeThumb) homeThumb(); });
['full','face','track','sprint'].forEach(k=>loadImg(DEMO_SRC[k]));
render(false);
/* bring back draft photos (older drafts kept them inside localStorage — those are moved over) */
Promise.all([idbLoad(),kvGet('profile'),kvGet('draft')]).then(([imgs,kp,kd])=>{
  let changed=false;
  if(kp&&typeof kp==='object'){ PHOTO_KEYS.forEach(k=>{ if(!profile[k]&&kp[k]){ profile[k]=kp[k]; changed=true; } });
    if((kp.savedAt||0)>(profile.savedAt||0)){ profile={...profile,...kp}; changed=true; } }
  if(kd&&kd.cover&&Array.isArray(kd.inner)&&kd.final&&(kd.updatedAt||0)>(draft.updatedAt||0)){ draft={...kd,images:draft.images||{}}; changed=true; }
  idbReady=true; kvReady=true;
  for(const k in imgs) if(!draft.images[k]){ draft.images[k]=imgs[k]; changed=true; }
  if(Object.keys(draft.images).length) idbSync(draft.images);
  writeProfile(); writeDraft(); // moves anything still kept only in localStorage into IndexedDB
  if(changed){ profileVer++; tileCache&&tileCache.clear&&tileCache.clear(); render(false); }
});
if(document.fonts){ document.fonts.ready.then(()=>{ refreshTiles(); refreshPreviews(); }); Promise.all([400,500,600,700].map(w=>document.fonts.load(`${w} 40px Onest`,'Кейс'))).then(()=>{ refreshTiles(); refreshPreviews(); },()=>{}); }
})();

</script>
